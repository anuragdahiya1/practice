        }
        
        .line2 {
            font-size: 52px;

        .line4 {
            font-size: 46px;
            font-weight: bold;
            background: linear-gradient(45deg, #32CD32, #00FA9A, #3CB371);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .blood-text {
            font-size: 48px;
            font-weight: 900;
            color: #8B0000;
            text-shadow: 
                2px 2px 0px rgba(139, 0, 0, 0.9),
                3px 3px 0px rgba(100, 0, 0, 0.8),
                0 0 8px rgba(139, 0, 0, 0.7);
            position: relative;
            display: inline-block;
            letter-spacing: 1px;
        }
        
        .blood-text::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            z-index: -1;
            color: #660000;
            text-shadow: 
                2px 2px 0px rgba(100, 0, 0, 0.7),
                4px 4px 0px rgba(80, 0, 0, 0.5);
        }
        
        .blood-drop {
            position: absolute;
            bottom: -15px;
            left: 0;
            width: 8px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #FF4444, #8B0000);
            border-radius: 50% 50% 60% 40%;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.8);
            animation: drip 2s ease-in infinite;
        }
        
        .blood-drop:nth-child(1) { left: 5%; animation-delay: 0s; }
        .blood-drop:nth-child(2) { left: 15%; animation-delay: 0.3s; }
        .blood-drop:nth-child(3) { left: 25%; animation-delay: 0.6s; }
        .blood-drop:nth-child(4) { left: 35%; animation-delay: 0.9s; }
        .blood-drop:nth-child(5) { left: 45%; animation-delay: 1.2s; }
        .blood-drop:nth-child(6) { left: 55%; animation-delay: 0.2s; }
        .blood-drop:nth-child(7) { left: 65%; animation-delay: 0.5s; }
        .blood-drop:nth-child(8) { left: 75%; animation-delay: 0.8s; }
        .blood-drop:nth-child(9) { left: 85%; animation-delay: 1.1s; }
        .blood-drop:nth-child(10) { left: 95%; animation-delay: 1.4s; }
        
        @keyframes drip {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(60px);
                opacity: 0;
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        .decoration {
            margin-top: 30px;
            font-size: 40px;
            animation: bounce 1.5s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
