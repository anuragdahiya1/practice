        /* Enhanced Blood Text Effect */
        .blood-text {

            display: inline-block;
            letter-spacing: 2px;
            margin: 30px 0;

        .blood-text-content {
            color: #8B0000;
            text-shadow: 
                /* Multiple red shadows for depth */
                -2px -2px 0 rgba(139, 0, 0, 0.9),
                2px -2px 0 rgba(139, 0, 0, 0.9),
                -2px 2px 0 rgba(139, 0, 0, 0.9),

                -3px 0 0 rgba(100, 0, 0, 0.8),
                3px 0 0 rgba(100, 0, 0, 0.8),

                /* Glow effect */

                0 0 25px rgba(200, 0, 0, 0.5),
                /* Bleeding effect */
                0 4px 10px rgba(139, 0, 0, 0.6),
                0 8px 15px rgba(100, 0, 0, 0.4);
            filter: drop-shadow(-2px -2px 1px rgba(70, 0, 0, 0.8))
                    drop-shadow(2px 2px 1px rgba(70, 0, 0, 0.8));
        }
        
        /* Blood drip container */
        .blood-drips-container {
            position: relative;
            height: 120px;
            margin: 20px 0;
        }
        
        .blood-drop {
            position: absolute;
            top: 0;
            width: 12px;
            height: 35px;
            background: linear-gradient(180deg, #FF3333 0%, #CC0000 50%, #660000 100%);
            border-radius: 50% 50% 50% 40%;
            box-shadow: 
                inset -1px 0 2px rgba(255, 100, 100, 0.6),
                0 0 8px rgba(139, 0, 0, 0.8),
                0 0 15px rgba(200, 0, 0, 0.5);
            animation: drip 2.5s ease-in infinite;
        }
        
        /* Positioned blood drops across the width */
        .blood-drop:nth-child(1) { left: 5%; animation-delay: 0s; }
        .blood-drop:nth-child(2) { left: 12%; animation-delay: 0.3s; }
        .blood-drop:nth-child(3) { left: 19%; animation-delay: 0.6s; }
        .blood-drop:nth-child(4) { left: 26%; animation-delay: 0.9s; }
        .blood-drop:nth-child(5) { left: 33%; animation-delay: 1.2s; }
        .blood-drop:nth-child(6) { left: 40%; animation-delay: 0.2s; }
        .blood-drop:nth-child(7) { left: 47%; animation-delay: 0.5s; }
        .blood-drop:nth-child(8) { left: 54%; animation-delay: 0.8s; }
        .blood-drop:nth-child(9) { left: 61%; animation-delay: 1.1s; }
        .blood-drop:nth-child(10) { left: 68%; animation-delay: 1.4s; }
        .blood-drop:nth-child(11) { left: 75%; animation-delay: 0.4s; }
        .blood-drop:nth-child(12) { left: 82%; animation-delay: 0.7s; }
        .blood-drop:nth-child(13) { left: 89%; animation-delay: 1s; }
        .blood-drop:nth-child(14) { left: 96%; animation-delay: 1.3s; }
        
        @keyframes drip {
            0% {
                transform: translateY(0);
                opacity: 1;
                height: 35px;
            }
            15% {
                height: 38px;
            }
            50% {
                opacity: 0.9;
                height: 35px;
            }
            100% {
                transform: translateY(120px);
                opacity: 0;
                height: 20px;
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        .decoration {
            margin-top: 30px;
            font-size: 40px;
            animation: bounce 1.5s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
