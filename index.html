<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 800px;
            text-align: center;
        }
        
        .line1 {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(45deg, #FF1493, #FF69B4, #FFB6C1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        .line2 {
            font-size: 52px;
            font-weight: bold;
            background: linear-gradient(45deg, #FF4500, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .line3 {
            font-size: 44px;
            font-weight: bold;
            background: linear-gradient(45deg, #00CED1, #1E90FF, #9370DB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        .line4 {
            font-size: 46px;
            font-weight: bold;
            background: linear-gradient(45deg, #32CD32, #00FA9A, #3CB371);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        .decoration {
            margin-top: 30px;
            font-size: 40px;
            animation: bounce 1.5s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="line1">
            Look my Love for you Pussy Girl!!!
        </div>
        <div class="line2">
            Fucking missing you like Hell!!!!
        </div>
        <div class="line3">
            Test your LOVEEEEEEEE!!!!!
        </div>
        <div class="line4">
            What is Love? Jaan can you please answer.
        </div>
        <div class="decoration">
            💗 💕 💖 💝 💞
        </div>
    </div>
</body>
</html>
