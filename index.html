<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>My Love Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;

        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 900px;
            text-align: center;
        }
        
        .line1 {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(45deg, #FF1493, #FF69B4, #FFB6C1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        .line2 {
            font-size: 52px;
            font-weight: bold;
            background: linear-gradient(45deg, #FF4500, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .line3 {
            font-size: 44px;
            font-weight: bold;
            background: linear-gradient(45deg, #00CED1, #1E90FF, #9370DB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        .line4 {
            font-size: 46px;
            font-weight: bold;
            background: linear-gradient(45deg, #32CD32, #00FA9A, #3CB371);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Blood Text with Dripping Effect */
        .blood-text {
            font-size: 54px;
            font-weight: 900;
            position: relative;
            display: inline-block;
            letter-spacing: 3px;
            margin: 30px 0;
            line-height: 1.3;
            font-family: 'Arial Black', sans-serif;
        }
        
        .blood-text-content {
            color: #000;
            position: relative;
            display: inline-block;
        }
        
        /* Individual character styling for drip effect */
        .blood-char {
            position: relative;
            display: inline-block;
            color: #000;
        }
        
        .blood-char::before {
            content: attr(data-char);
            position: absolute;
            left: 0;
            top: 0;
            background: linear-gradient(to bottom, #FF3333, #CC0000, #990000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
        }
        
        .blood-char::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: linear-gradient(to bottom, #CC0000, #990000, transparent);
            animation: drip-line 2.2s ease-in infinite;
            opacity: 0.9;
        }
        
        .blood-char:nth-child(1)::after { animation-delay: 0s; }
        .blood-char:nth-child(2)::after { animation-delay: 0.15s; }
        .blood-char:nth-child(3)::after { animation-delay: 0.3s; }
        .blood-char:nth-child(4)::after { animation-delay: 0.45s; }
        .blood-char:nth-child(5)::after { animation-delay: 0.6s; }
        .blood-char:nth-child(6)::after { animation-delay: 0.75s; }
        .blood-char:nth-child(7)::after { animation-delay: 0.9s; }
        .blood-char:nth-child(8)::after { animation-delay: 1.05s; }
        .blood-char:nth-child(9)::after { animation-delay: 1.2s; }
        .blood-char:nth-child(10)::after { animation-delay: 1.35s; }
        .blood-char:nth-child(11)::after { animation-delay: 1.5s; }
        .blood-char:nth-child(12)::after { animation-delay: 1.65s; }
        .blood-char:nth-child(13)::after { animation-delay: 1.8s; }
        .blood-char:nth-child(14)::after { animation-delay: 0.2s; }
        .blood-char:nth-child(15)::after { animation-delay: 0.5s; }
        .blood-char:nth-child(16)::after { animation-delay: 0.8s; }
        .blood-char:nth-child(17)::after { animation-delay: 1.1s; }
        .blood-char:nth-child(18)::after { animation-delay: 1.4s; }
        
        @keyframes drip-line {
            0% {
                height: 30px;
                opacity: 1;
            }
            70% {
                opacity: 0.8;
            }
            100% {
                height: 50px;
                opacity: 0;
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }
        
        .decoration {
            margin-top: 30px;
            font-size: 40px;
            animation: bounce 1.5s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
